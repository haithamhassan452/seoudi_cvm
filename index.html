<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online CVM Tower — Seoudi</title>
<meta name="description" content="Control tower for customer value management: store-level CVM index against target, lifecycle movement, treatment allocation, activity log and A/B test registry.">
<meta name="theme-color" content="#0E6E5C">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Online CVM Tower — Seoudi">
<meta property="og:description" content="Every branch, every activity, every test tied to one number: the store's CVM target.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E6E5C'/%3E%3Ctext x='32' y='43' font-family='Segoe UI,Arial,sans-serif' font-size='21' font-weight='700' fill='%23FFFDF8' text-anchor='middle'%3ECVM%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F2EEE5;          /* page cream */
  --bg2:#FFFDF8;         /* drawer / raised */
  --panel:#FFFDF8;       /* card */
  --panel2:#F7F4EC;      /* inner tile */
  --panel3:#EFEADD;      /* track / rail */
  --line:#EDE7D9;
  --line2:#DCD5C5;
  --tx:#181A1F;
  --tx2:#5D645E;
  --tx3:#8A8F87;
  --g:#2F9E66;           /* on target */
  --w:#C08A12;           /* watch */
  --o:#C2622A;           /* off target */
  --r:#9B1612;           /* critical */
  --acc:#0E6E5C;         /* brand deep green */
  --cyan:#1E7A8C;
  --v:#5B4B9E;
  --r1:14px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(24,26,31,.045),0 8px 24px -18px rgba(24,26,31,.22);
}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  font-size:12.5px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ---------- app bar ---------- */
.appbar{position:sticky;top:0;z-index:30;background:#F5F3EB;border-bottom:1px solid #E6E0D2}
.appbar-in{max-width:1560px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:26px;height:58px}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center;
  font-size:11px;font-weight:800;letter-spacing:.4px}
.brand-txt b{font-size:15px;font-weight:700;letter-spacing:-.2px;color:#101C16}
.tabs-main{display:flex;align-items:center;gap:2px;flex:1 1 auto;overflow-x:auto;height:100%;scrollbar-width:none}
.tabs-main::-webkit-scrollbar{display:none}
.tabs-main a{display:flex;align-items:center;gap:6px;height:100%;padding:0 11px;font-size:12.5px;font-weight:600;
  color:var(--tx2);text-decoration:none;border-bottom:2.5px solid transparent;white-space:nowrap;cursor:pointer;transition:color .15s}
.tabs-main a:hover{color:var(--tx)}
.tabs-main a.on{color:var(--tx);border-bottom-color:var(--acc)}
.tabs-main a .cnt{background:#D6453D;color:#fff;font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:9px;line-height:1.5}
.appbar-right{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.pill-admin{background:#D8EBE5;color:#0A4D40;font-size:10px;font-weight:800;letter-spacing:.8px;padding:5px 11px;border-radius:7px}

/* ---------- page ---------- */
.page{max-width:1560px;margin:0 auto;padding:26px 22px 70px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:31px;font-weight:700;letter-spacing:-.9px;color:#0E1512;display:inline-block;vertical-align:middle}
.tag{display:inline-block;vertical-align:middle;margin-left:10px;border:1px solid #D8D2C2;color:var(--tx3);
  font-size:9.5px;font-weight:800;letter-spacing:1px;padding:3px 9px;border-radius:20px;background:transparent}
.page-sub{color:var(--tx2);font-size:12.5px;margin-top:5px}
.page-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding-top:6px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;background:#FFFDF8;border:1px solid #E2DCCE;color:var(--tx);
  font-size:12px;font-weight:600;padding:8px 14px;border-radius:10px;cursor:pointer;font-family:inherit;
  transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover{background:#FBF8F0;border-color:#D3CBB9}
.btn.primary{background:#2F9E66;border-color:#2F9E66;color:#fff;box-shadow:0 1px 2px rgba(47,158,102,.25)}
.btn.primary:hover{background:#288A59;border-color:#288A59}
.btn.sm{padding:5px 11px;font-size:11.5px;border-radius:8px}
.btn.ghost{background:transparent}
.chip{display:inline-flex;align-items:center;gap:7px;background:#FFFDF8;border:1px solid #E2DCCE;
  padding:8px 13px;border-radius:10px;font-size:12px;color:var(--tx2);font-weight:600}
.chip .dot,.dot{width:7px;height:7px;border-radius:50%;background:var(--g);flex:0 0 7px}
.dot.w{background:var(--w)}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r1);padding:16px;box-shadow:var(--shadow)}
.card.pad0{padding:0;overflow-y:hidden;overflow-x:auto}
.card-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{font-size:13.5px;font-weight:700;letter-spacing:-.15px;color:#101C16}
.card-h .sub{font-size:11.5px;color:var(--tx3);margin-top:2px;flex:1 1 auto}
.card-h .right{flex:0 0 auto;display:flex;align-items:center;gap:6px}

/* ---------- type bits ---------- */
.small{font-size:11.5px}
.tsub{font-size:10.5px;color:var(--tx3);line-height:1.45}
.tname{font-size:12px;font-weight:650;color:var(--tx);letter-spacing:-.1px}
.muted{color:var(--tx3)}
.mono{font-family:var(--mono);font-size:11px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.sec{font-size:9.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--tx3);font-weight:800;margin:20px 0 9px}
.sec:first-child{margin-top:0}
.flex1{flex:1 1 auto;min-width:0}
.row{display:flex;align-items:center;gap:8px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ---------- layout ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 2fr}
.g34{grid-template-columns:3fr 2fr}
@media(max-width:1250px){.g4{grid-template-columns:repeat(2,1fr)}.g23,.g32,.g34,.g3{grid-template-columns:1fr}}
@media(max-width:760px){.g2,.g4{grid-template-columns:1fr}}

/* ---------- kpi ---------- */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r1);padding:14px 16px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.kpi .lbl{font-size:9.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.7px;font-weight:800}
.kpi .val{font-size:26px;font-weight:700;letter-spacing:-1px;margin-top:6px;font-variant-numeric:tabular-nums;color:#0E1512}
.kpi .val small{font-size:13px;font-weight:600;color:var(--tx3)}
.kpi .delta{font-size:11px;margin-top:3px;color:var(--tx2);display:flex;align-items:center;gap:4px}
.kpi .spark{position:absolute;right:0;bottom:0;opacity:.5}
.up{color:var(--g);font-weight:700}
.down{color:var(--r);font-weight:700}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx3);font-weight:800;
  padding:9px 11px;border-bottom:1px solid var(--line2);background:transparent;white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid #F1ECE0;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.cl{cursor:pointer;transition:background .12s}
tbody tr.cl:hover{background:#FBF8F0}
.tr{text-align:right}
th.tr{text-align:right}

/* ---------- status pills ---------- */
.st{display:inline-flex;align-items:center;gap:5px;padding:2.5px 8px;border-radius:20px;font-size:10px;font-weight:700;
  letter-spacing:.1px;white-space:nowrap;border:1px solid transparent;line-height:1.5}
.st i{width:5px;height:5px;border-radius:50%;background:currentColor}
.st.g{color:#1F7A4F;background:#E4F3EA;border-color:#C9E7D6}
.st.w{color:#8A6209;background:#FBF1D9;border-color:#EFDFBB}
.st.o{color:#A0521F;background:#FBEBDF;border-color:#EFD6C3}
.st.r{color:#8E1410;background:#F8E3E1;border-color:#EEC9C5}
.st.n{color:var(--tx2);background:#F4F1E8;border-color:#E4DECF}
.st.b{color:#24549B;background:#E7EEF9;border-color:#CBDCF1}
.st.c{color:#155E6B;background:#E2F0F2;border-color:#C4E2E6}
.st.v{color:#4B3D85;background:#ECE8F7;border-color:#D8D1EC}
.flag{display:inline-block;background:#F8E3E1;color:#8E1410;border:1px solid #EEC9C5;font-size:9.5px;font-weight:700;
  padding:2px 7px;border-radius:5px;margin-right:3px;white-space:nowrap}
.flag.w{background:#FBF1D9;color:#8A6209;border-color:#EFDFBB}

/* ---------- tabs ---------- */
.tabs{display:inline-flex;background:#F5F2E9;border:1px solid var(--line2);border-radius:10px;padding:3px;gap:2px}
.tabs button{background:none;border:0;color:var(--tx2);font-size:11.5px;font-weight:650;padding:5px 12px;border-radius:7px;
  cursor:pointer;font-family:inherit;transition:background .15s,color .15s}
.tabs button:hover{color:var(--tx)}
.tabs button.on{background:#FFFDF8;color:var(--tx);box-shadow:0 1px 2px rgba(24,26,31,.09)}

/* ---------- bars / mix ---------- */
.bar{height:6px;border-radius:4px;background:var(--panel3);overflow:hidden;min-width:38px}
.bar>i{display:block;height:100%;border-radius:4px}
.mix{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--panel3)}
.mix>i{display:block;height:100%}

/* ---------- waterfall ---------- */
.wf{display:flex;flex-direction:column;gap:6px}
.wf-row{display:flex;align-items:center;gap:9px;font-size:11.5px}
.wf-row .n{width:104px;color:var(--tx2)}
.wf-track{flex:1;height:16px;background:var(--panel3);border-radius:4px;position:relative;overflow:hidden}
.wf-fill{position:absolute;top:0;bottom:0;border-radius:3px}
.wf-row .v{width:56px;text-align:right;font-family:var(--mono);font-size:11px}

/* ---------- lifecycle matrix ---------- */
.mx{display:grid;gap:2px;font-size:10.5px}
.mx .mh{display:grid;place-items:center;color:var(--tx3);font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:4px 0}
.mx .mr{display:grid;place-items:center;color:var(--tx3);font-size:9px;font-weight:800}
.mx .cell{border-radius:5px;padding:5px 3px;text-align:center;font-family:var(--mono);font-size:10.5px;line-height:1.25}
.mx .cell b{display:block;font-size:11px}
.mx .cell span{font-size:8.5px;opacity:.9}

/* ---------- boxes ---------- */
.warnbox,.okbox{display:flex;gap:9px;align-items:flex-start;border-radius:10px;padding:10px 13px;font-size:11.5px;line-height:1.55}
.warnbox{background:#FBEDD9;border:1px solid #F0D8B4;color:#6E4A10}
.okbox{background:#E9F5EE;border:1px solid #CBE7D8;color:#1F5B3F}
.warnbox b,.okbox b{font-weight:700}
.warnbox>span:first-child,.okbox>span:first-child{font-weight:700;flex:0 0 auto}

/* ---------- code ---------- */
.code{background:#12211C;border:1px solid #1E3229;border-radius:10px;padding:12px;font-family:var(--mono);font-size:10.5px;
  color:#A9C4B7;overflow-x:auto;line-height:1.65;white-space:pre}

/* ---------- fields ---------- */
.field label{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);font-weight:800;margin-bottom:5px}
.field select,.field input[type=text]{width:100%;background:#FFFDF8;border:1px solid var(--line2);color:var(--tx);
  border-radius:9px;padding:8px 10px;font-size:12px;font-family:inherit;outline:none}
.field select:focus{border-color:var(--acc)}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:4px;background:var(--panel3);outline:none;margin-top:8px;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--acc);
  cursor:pointer;border:2px solid #FFFDF8;box-shadow:0 0 0 1px var(--acc),0 1px 3px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--acc);cursor:pointer;border:2px solid #FFFDF8}

/* ---------- legend / misc ---------- */
.legend{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--tx2);font-weight:600}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.empty{padding:34px;text-align:center;color:var(--tx3);font-size:12px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(24,26,31,.34);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:780px;max-width:96vw;z-index:50;background:var(--bg2);
  border-left:1px solid var(--line2);box-shadow:-24px 0 60px rgba(24,26,31,.16);transform:translateX(100%);
  transition:transform .26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-h{display:flex;align-items:flex-start;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);background:#FBF9F2}
.drawer-h h2{font-size:17px;font-weight:700;letter-spacing:-.4px;color:#0E1512}
.drawer-h .sub{font-size:11.5px;color:var(--tx3);margin-top:3px}
.drawer-h .x{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--tx2);
  border:1px solid var(--line2);background:#FFFDF8;font-size:12px;flex:0 0 28px}
.drawer-h .x:hover{background:#F4F1E8}
.drawer-b{overflow-y:auto;padding:20px 22px 60px;flex:1}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);background:#12211C;color:#F2F5F0;
  border-radius:11px;padding:11px 17px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:9px;
  box-shadow:0 12px 34px rgba(24,26,31,.32);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}

::selection{background:#CDE8DC;color:#0E1512}
</style>
</head>
<body>
<noscript><div style="padding:24px;font-family:Segoe UI,Arial,sans-serif;background:#F2EEE5;color:#181A1F">
<b>Online CVM Tower</b> needs JavaScript — the entire view layer is rendered client-side from an in-page data engine.</div></noscript>
<header class="appbar">
  <div class="appbar-in">
    <div class="brand">
      <div class="mark">CVM</div>
      <div class="brand-txt"><b>Online CVM Tower</b></div>
    </div>
    <nav class="tabs-main" id="nav"></nav>
    <div class="appbar-right">
      <span class="pill-admin">ADMIN</span>
      <button class="btn ghost" onclick="toast('Prototype — no session behind this button','ok')">Sign out</button>
    </div>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <div>
      <h1 id="pgTitle">Control Tower</h1><span class="tag" id="pgChip">NETWORK</span>
      <div class="page-sub" id="pgSub">—</div>
    </div>
    <div class="page-actions">
      <div class="chip" id="periodChip"></div>
      <button class="btn primary" onclick="toast('Magento incremental sync queued — orders, items, dismissals, store attribution','ok')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>Sync Magento
      </button>
      <button class="btn" onclick="go('activities')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>New activity
      </button>
    </div>
  </div>
  <div id="view"></div>
</main>

<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-h"><div class="flex1"><h2 id="dTitle">—</h2><div class="sub" id="dSub">—</div></div><div class="x" onclick="closeDrawer()">✕</div></div>
  <div class="drawer-b" id="dBody"></div>
</div>
<div class="toast" id="toast"><span id="toastIcon">✓</span><span id="toastMsg"></span></div>
<script>
/* ============================================================
   CVM CONTROL TOWER — synthetic but internally consistent data.
   Every index, decomposition and money figure is computed from the
   generation functions below, so the screens reconcile.
   ============================================================ */

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var rnd = mulberry32(20261104);
function rf(a,b){return a+rnd()*(b-a)}
function ri(a,b){return a+Math.floor(rnd()*(b-a+1))}
function pick(a){return a[Math.floor(rnd()*a.length)]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function r4(x){return Math.round(x*10000)/10000}
function r2(x){return Math.round(x*100)/100}
function tint(hex,a){var h=hex.replace('#','');return 'rgba('+parseInt(h.substr(0,2),16)+','+parseInt(h.substr(2,2),16)+','+parseInt(h.substr(4,2),16)+','+a+')'}

/* ---------- formatting ---------- */
function egp(v,d){ if(Math.abs(v)>=1e6) return 'EGP '+(v/1e6).toFixed(d===undefined?2:d)+'M';
  if(Math.abs(v)>=1e3) return 'EGP '+(v/1e3).toFixed(d===undefined?1:d)+'k';
  return 'EGP '+Math.round(v).toLocaleString('en-US'); }
function n0(v){return Math.round(v).toLocaleString('en-US')}
function pc(x,d){return (x*100).toFixed(d===undefined?1:d)+'%'}
function pt(x,d){return (x>=0?'+':'')+x.toFixed(d===undefined?1:d)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ---------- the index ---------- */
var WT = {con:0.40, frq:0.20, val:0.25, bse:0.15};
var BASE = {con:0.628, frq:2.35, val:760, bse:0.402};   // FY2026 H1 group baseline = 100

function cvmOf(c,f,v,b){
  return 100*Math.pow(c/BASE.con,WT.con)*Math.pow(f/BASE.frq,WT.frq)
            *Math.pow(v/BASE.val,WT.val)*Math.pow(b/BASE.bse,WT.bse);
}
/* exact log decomposition in index points; the four terms sum to ΔCVM */
function decomp(p,c){
  var prev=cvmOf(p.con,p.frq,p.val,p.bse), out={};
  ['con','frq','val','bse'].forEach(function(k){ out[k]=prev*WT[k]*Math.log(c[k]/p[k]); });
  return out;
}

/* ---------- dimensions ---------- */
var AREAS=[
  {id:'AR1',name:'Nasr City'},{id:'AR2',name:'Heliopolis'},{id:'AR3',name:'Maadi'},
  {id:'AR4',name:'Giza & 6th of October'},{id:'AR5',name:'New Cairo'},{id:'AR6',name:'Alexandria'}
];
var STAGE_KEYS=['S0','S1','S2','S3','S4','S5','S6'];
var STAGE_NAMES={S0:'Registered, no order',S1:'New (1 order)',S2:'Developing (2)',S3:'Active',S4:'At risk',S5:'Churned',S6:'Lost'};
var STAGE_TREAT={S0:'T1',S1:'T2',S2:'T2',S3:'T3',S4:'T4',S5:'T4',S6:'T4'};
var TIERS=['VIP','A','B','C','D'];
var TIER_RULE={VIP:'AOV ≥ 3,000',A:'1,500 – 2,999',B:'1,000 – 1,499',C:'500 – 999',D:'< 500'};
var TREAT={
  T1:{name:'New demand',color:'#1E7A8C',stages:'S0',kpi:'Registration → first order'},
  T2:{name:'Activate new',color:'#2F5FB0',stages:'S1–S2',kpi:'Second order by day 14/28'},
  T3:{name:'Push frequency',color:'#2F9E66',stages:'S3',kpi:'Continuation · orders per active'},
  T4:{name:'Poke & recover',color:'#9B1612',stages:'S4–S6',kpi:'Rescue rate · reactivation'}
};

var STORE_DEFS=[
  ['S01','Nasr City — Abbas El Akkad','AR1','Supermarket'],
  ['S02','Nasr City — Makram Ebeid','AR1','Express'],

function statusOf(cvm,target){
  var d=cvm-target;
  if(d>=0) return 'g'; if(d>=-3) return 'w'; if(d>=-8) return 'o'; return 'r';
}
function flagsOf(s){
  var f=[], w=s.weekly, cur=w[11], prev=w[10], m4=w[8];
  var newMoM=cur.newCust/m4.newCust-1;
  var cvmMoM=cur.cvm-m4.cvm;
  var cvmDelta=cur.cvm-prev.cvm;
  if(newMoM>=0.10 && cvmMoM<=-3) f.push(['Growth masking decay','r']);
  if((prev.con-cur.con)>=0.05) f.push(['Continuation cliff','r']);
  var frqDrop=(prev.frq-cur.frq)/prev.frq;
  if(frqDrop>=0.10 && Math.abs(prev.con-cur.con)<0.02) f.push(['Frequency stall','w']);
  if(s.guard.dismiss>=0.035 && cur.con<BASE.con && cur.cvm<s.target) f.push(['Dismissal drag','r']);
  if(s.pl.delta<=-0.03) f.push(['Own-brand erosion','w']);
  if(s.guard.optOut>0.0045) f.push(['Opt-out risk','w']);
  return f;
}

function buildMatrix(base, bias){

  for(var i=0;i<7;i++){ m[i]=[]; for(var j=0;j<5;j++){ t=Math.round(base*STAGE_W[i]*TIER_W[j]*rf(0.75,1.28)*(bias&&bias[i]?bias[i][j]||1:1)); m[i][j]=t; tot+=t; } }

  for(var i2=0;i2<7;i2++) for(var j2=0;j2<5;j2++) m[i2][j2]=Math.round(m[i2][j2]*k);

}

/* ---------- treatment allocation ---------- */
function allocate(s){
  var m=s.matrix, val=s.weekly[11].val;
  var s0=stageTotal(m,0), s1=stageTotal(m,1), s2=stageTotal(m,2), s3=stageTotal(m,3);
  var s4=stageTotal(m,4), s5=stageTotal(m,5), s6=stageTotal(m,6);
  var rows=[
    {t:'T1', addr:s0,            gap:0.034, uplift:0.11, value:val*0.9},
    {t:'T2', addr:s1+s2,         gap:0.052, uplift:0.14, value:val},
    {t:'T3', addr:s3,            gap:0.038, uplift:0.08, value:val*1.6},
    {t:'T4', addr:s4+s5+s6,      gap:0.061, uplift:0.12, value:val*1.2}
  ];
  // store-specific gaps so the recommendation is not identical everywhere
  var seedIdx=STORES.indexOf(s);
  rows.forEach(function(r,i){
    r.gap=clamp(r.gap*rf(0.35,1.85),0.004,0.09);
    r.expected=r.addr*r.gap*r.uplift*r.value;
    r.cost=r.addr*rf(1.4,6.2);
    r.score=r.expected-r.cost;
  });
  var total=rows.reduce(function(a,r){return a+Math.max(0,r.score)},0)||1;
  rows.forEach(function(r){ r.share=Math.max(0,r.score)/total; });
  rows.sort(function(a,b){return b.score-a.score});
  return rows;
}

   ============================================================ */
function spark(series,w,h,color,area){
  var mn=Math.min.apply(null,series),mx=Math.max.apply(null,series),rg=(mx-mn)||1,i;
  var pts=[]; for(i=0;i<series.length;i++) pts.push([(i/(series.length-1))*w, h-((series[i]-mn)/rg)*(h-6)-3]);
  var d=''; for(i=0;i<pts.length;i++) d+=(i?'L':'M')+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1);
  var g=area?'<path d="'+d+' L'+w+' '+h+' L0 '+h+' Z" fill="'+color+'" opacity="0.13"/>':'';
  return '<svg width="'+w+'" height="'+h+'" preserveAspectRatio="none"><g>'+g+
    '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></g></svg>';
}
function statusPill(k){
  var m={g:['g','On target'],w:['w','Watch'],o:['o','Off target'],r:['r','Critical']};
  var x=m[k]||['n',k];
  return '<span class="st '+x[0]+'"><i></i>'+x[1]+'</span>';
}
function flagsChips(s){
  if(!s.flags.length) return '<span class="muted small">—</span>';
  return s.flags.slice(0,2).map(function(f){
    return '<span class="flag'+(f[1]==='w'?' w':'')+'">'+f[0]+'</span>';
  }).join(' ');
}
function treatChip(t){
  var d=TREAT[t];
  return '<span class="st" style="color:'+d.color+';background:'+d.color+'1a;border-color:'+d.color+'40"><i></i>'+t+' '+d.name+'</span>';
}
function waterfall(s){
  var d=s.decomp, mx=Math.max(0.4,Math.abs(d.con),Math.abs(d.frq),Math.abs(d.val),Math.abs(d.bse));
  var rows=[['Continuation','con'],['Frequency','frq'],['Basket value','val'],['Base health','bse']];
  var h='<div class="wf">';
  rows.forEach(function(r){
    var v=d[r[1]], w=Math.abs(v)/mx*46, pos=v>=0;
    h+='<div class="wf-row"><div class="n">'+r[0]+'</div>'+
       '<div class="wf-track">'+
         '<div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)"></div>'+
         '<div style="position:absolute;top:4px;bottom:4px;border-radius:3px;'+
            (pos?('left:50%;width:'+w+'%;background:var(--g)'):('left:'+(50-w)+'%;width:'+w+'%;background:var(--r)'))+
         '"></div>'+
       '</div>'+
       '<div class="v" style="color:'+(v>=0?'var(--g)':'var(--r)')+'">'+pt(v,2)+'</div></div>';
  });
  return h+'</div>';
}
function dominantComponent(s){
  var d=s.decomp, best=null;
  Object.keys(d).forEach(function(k){ if(best===null||d[k]<d[best]) best=k; });
  if(d[best]>=0) Object.keys(d).forEach(function(k){ if(d[k]>d[best]) best=k; });
  return {key:best, value:d[best], label:{con:'continuation',frq:'frequency',val:'basket value',bse:'base health'}[best]};
}
function kpiCard(lbl,val,delta,dir,series,color){
  return '<div class="kpi"><div class="lbl">'+lbl+'</div><div class="val">'+val+'</div>'+
    '<div class="delta"><span class="'+(dir==='up'?'up':'down')+'">'+(dir==='up'?'▲':'▼')+'</span> '+delta+'</div>'+
    '<div class="spark">'+spark(series,84,38,color,true)+'</div></div>';
}

    (dom.value<0

        :dom.key==='frq'?'Customers still buy, but less often — a routine or range problem.'
        :dom.key==='val'?'Basket size moved; check leaflet mix and promotion depth before spending on retention.'
        :'Base coverage moved; check store assignment and catchment before anything else.')

    '</span></div></div>';

  /* guardrails */
  b+='<div class="sec">Guardrails</div>';
  var g=s.guard;
  var gitems=[
    ['Opt-out rate',pc(g.optOut,2),g.optOut>0.0045],['NPS',g.nps+'',g.nps<25],
    ['Fulfilment',pc(g.fulfil,1),g.fulfil<0.93],['Dismissal rate',pc(g.dismiss,1),g.dismiss>0.03],
    ['Complaints / 1k',g.complaints+'',g.complaints>12],['Contacts / customer / wk',g.contact.toFixed(1),g.contact>3]
  ];
  b+='<div class="grid g3" style="gap:8px">'+gitems.map(function(x){
    return '<div style="background:'+(x[2]?'#FBF0EA':'var(--panel)')+';border:1px solid '+(x[2]?'#EBCDBB':'var(--line)')+';border-radius:8px;padding:8px 10px">'+

  }).join('')+'</div>';
  if(s.status!=='g' && gitems.some(function(x){return x[2]}))
    b+='<div class="warnbox" style="margin-top:8px"><span>⚠</span><span>Guardrail breach downgrades this store one status level. It cannot be traded against index improvement.</span></div>';

  /* treatment allocation */
  b+='<div class="sec">Recommended effort mix</div>';
  b+='<div class="card" style="padding:12px">';
  b+='<div class="mix" style="height:11px;margin-bottom:10px">'+s.alloc.map(function(r){
      return '<i style="width:'+(r.share*100).toFixed(1)+'%;background:'+TREAT[r.t].color+'"></i>';
    }).join('')+'</div>';
  s.alloc.forEach(function(r,i){
    var d=TREAT[r.t], m=s.matrix, addr={T1:stageTotal(m,0),T2:stageTotal(m,1)+stageTotal(m,2),T3:stageTotal(m,3),T4:stageTotal(m,4)+stageTotal(m,5)+stageTotal(m,6)}[r.t];
    b+='<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)">'+

      '<div style="text-align:right"><div class="num" style="font-weight:700">'+(r.share*100).toFixed(0)+'%</div>'+
      '<div class="tsub">'+egp(r.expected/1000)+'/wk</div></div></div>';
  });
  b+='<div class="row" style="margin-top:10px"><button class="btn primary sm" onclick="toast(\'4 activities drafted from this mix — review and approve in the Activities Log\',\'ok\')">Create activities from this mix</button>'+
     '<button class="btn sm" onclick="toast(\'Allocation recalculated with this week\\\'s movement\',\'ok\')">Recalculate</button></div>';
  b+='<div class="tsub" style="margin-top:8px">need_score = addressable × gap vs group median × basket × uplift − cost. Ties broken by margin cost of the mechanic.</div>';
  b+='</div>';

  /* lifecycle matrix */
  b+='<div class="sec">Lifecycle × tier (this store)</div>';
  b+='<div class="card" style="padding:10px;overflow-x:auto">'+matrixHTML(s.matrix,s.prevMatrix,true)+'</div>';

  b+='<div class="sec">Recent activities in this store</div>';

  b+='<div class="card pad0" style="border-radius:9px"><table><tbody>';
  acts.forEach(function(a){
    var st=actStatus(a.status);
    b+='<tr class="cl" onclick="openActivity(\''+a.id+'\')"><td style="padding:7px 10px">'+
      '<div class="small" style="font-weight:600">'+esc(a.name)+'</div>'+
      '<div class="tsub">'+a.week+' · '+a.channel+' · '+n0(a.audience)+' audience</div></td>'+
      '<td class="tr" style="padding:7px 10px"><div class="num small">'+(a.incremental!=null?egp(a.incremental):'—')+'</div>'+
      '<div class="tsub">incremental</div></td>'+
      '<td style="padding:7px 10px">'+'<span class="st '+st[0]+'"><i></i>'+st[1]+'</span>'+'</td></tr>';
  });
  b+='</tbody></table></div>';
  if(!acts.length) b+='<div class="card"><div class="empty">No activities in this store yet.</div></div>';

  /* insights */
  var ins=INSIGHTS.filter(function(x){return x.store===s.code||x.store==='Group'}).slice(0,3);
  if(ins.length){
    b+='<div class="sec">Signals behind the movement</div>';
    ins.forEach(function(x){
      b+='<div class="card" style="padding:10px 12px;margin-bottom:8px">'+
        '<div class="spread" style="margin-bottom:3px"><span class="st c" style="font-size:9.5px"><i></i>'+x.signal+'</span>'+
        '<span class="mono tsub">r='+x.r.toFixed(2)+' · n='+x.n+' · lag '+x.lag+'w · conf '+pc(x.conf,0)+'</span></div>'+
        '<div class="small" style="color:var(--tx2);line-height:1.55">'+esc(x.statement)+'</div></div>';
    });

     '</div><button class="btn sm" style="margin-top:8px" onclick="toast(\'Note added — timestamped and attributed\',\'ok\')">Add note</button></div>';

/* shared matrix renderer */
function matrixHTML(m,prev,compact){
  var h='<div class="mx" style="grid-template-columns:'+(compact?'46px':'58px')+' repeat(5,1fr) 44px">';
  h+='<div class="mh"></div>'+TIERS.map(function(t){return '<div class="mh">'+t+'</div>'}).join('')+'<div class="mh">Total</div>';
  for(var i=0;i<7;i++){
    h+='<div class="mr">'+STAGE_KEYS[i]+'</div>';
    for(var j=0;j<5;j++){
      var v=m[i][j], p=prev?prev[i][j]:v, d=v-p;
      var a=clamp(v/(compact?190:3400),0.05,0.8);
      h+='<div class="cell" title="'+STAGE_NAMES[STAGE_KEYS[i]]+' × '+TIERS[j]+': '+n0(v)+(prev?' ('+pt(d,0)+')':'')+'" '+
        'style="background:rgba(14,110,92,'+a.toFixed(2)+');border:1px solid rgba(14,110,92,'+(Math.min(0.9,a*1.5)).toFixed(2)+')">'+
        '<b style="color:'+(a>0.55?'#fff':'var(--tx2)')+'">'+n0(v)+'</b>'+
        (prev?'<span style="color:'+(d>0?'#1F7A4F':d<0?'#9B1612':'var(--tx3)')+'">'+pt(d,0)+'</span>':'')+'</div>';
    }
    var tot=stageTotal(m,i), ptot=prev?stageTotal(prev,i):tot, dt=tot-ptot;
    h+='<div class="cell" style="background:var(--panel2)"><b>'+n0(tot)+'</b><span style="color:'+(dt>0?'#1F7A4F':dt<0?'#9B1612':'var(--tx3)')+'">'+(prev?pt(dt,0):'')+'</span></div>';
  }
  h+='</div>';
  return h;
}

/* ============================================================
   SCREEN 4 — LIFECYCLE MOVEMENT
   ============================================================ */
function vMovement(){
  var m=GROUP_MATRIX, p=GROUP_PREV, total=matrixTotal(m);
  var atRisk=stageTotal(m,4)+stageTotal(m,5)+stageTotal(m,6);
  var h='';

  h+='<div class="grid g4" style="margin-bottom:12px">'+
    [['Active base',pc(stageTotal(m,3)/total,1),'S3 of '+n0(total),'var(--g)'],
     ['At risk + churned + lost',pc(atRisk/total,1),n0(atRisk)+' customers','var(--o)'],
     ['Not yet ordered',pc(stageTotal(m,0)/total,1),'S0 — T1 demand pool','var(--cyan)'],
     ['Net into S4 this week',pt(stageTotal(m,4)-stageTotal(p,4),0),'customers moved to at-risk','var(--r)']]
    .map(function(x){return '<div class="card" style="padding:12px"><div class="small muted" style="font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700">'+x[0]+'</div>'+
      '<div class="num" style="font-size:20px;font-weight:700;margin:3px 0;color:'+x[3]+'">'+x[1]+'</div><div class="tsub">'+x[2]+'</div></div>'}).join('')+
    '</div>';

  h+='<div class="card" style="margin-bottom:12px"><div class="card-h"><h3>Stage × value tier — whole group</h3>'+
    '<div class="sub">W44 → W45 · cells show current count with week-on-week change · heavier fill = more customers</div></div>'+
    '<div style="overflow-x:auto">'+matrixHTML(m,p,false)+'</div>'+
    '<div class="small muted" style="margin-top:10px">Stages: S0 registered-no-order · S1 new (1 order) · S2 developing (2) · S3 active · S4 at risk · S5 churned · S6 lost. '+
    'Tiers by AOV of the last three orders.</div></div>';

  /* stage flow table */
  h+='<div class="grid g2">';
  h+='<div class="card pad0"><div class="card-h" style="padding:14px 14px 0"><h3>Where the customers went</h3><div class="sub">net movement by stage, priced at stage basket</div></div>'+
    '<table><thead><tr><th>Stage</th><th class="tr">W44</th><th class="tr">W45</th><th class="tr">Net</th><th class="tr">Value impact</th><th>Read</th></tr></thead><tbody>';
  var basketByStage=[180,420,620,910,640,410,290];
  for(var i=0;i<7;i++){
    var a=stageTotal(p,i), b=stageTotal(m,i), d=b-a;
    var valDelta=d*basketByStage[i];
    var read = i===3 ? (d<0?'draining into risk':'holding') :
               i===4 ? (d>0?'inflow from S3':'recovering') :
               i===6 ? (d>0?'slipping out of reach':'some recovered') :
               i===0 ? (d>0?'new registrations':'converting out') : (d>0?'gaining':'losing');
    h+='<tr><td><div class="tname">'+STAGE_KEYS[i]+' · '+STAGE_NAMES[STAGE_KEYS[i]]+'</div></td>'+
      '<td class="tr num muted">'+n0(a)+'</td><td class="tr num">'+n0(b)+'</td>'+
      '<td class="tr num" style="color:'+(d>=0?'var(--g)':'var(--r)')+';font-weight:700">'+pt(d,0)+'</td>'+
      '<td class="tr num" style="color:'+(valDelta>=0?'var(--g)':'var(--r)')+'">'+pt(valDelta/1000,0)+'k</td>'+
      '<td class="small muted">'+read+'</td></tr>';
  }
  h+='</tbody></table></div>';

  /* per store selector */
  h+='<div class="card"><div class="card-h"><h3>One store at a time</h3><div class="sub">movement is a store decision, not a group average</div></div>'+
    '<div class="field" style="margin-bottom:10px"><label>Branch</label><select onchange="state.movStore=this.value;render()">'+
    '<option value="">Group</option>'+
    STORES.map(function(s){return '<option value="'+s.code+'"'+(state.movStore===s.code?' selected':'')+'>'+s.code+' · '+esc(s.name)+'</option>'}).join('')+
    '</select></div>';
  var sel=state.movStore?STORES.filter(function(s){return s.code===state.movStore})[0]:null;
  if(sel){
    h+='<div style="overflow-x:auto">'+matrixHTML(sel.matrix,sel.prevMatrix,true)+'</div>';
    var aR=stageTotal(sel.matrix,4)+stageTotal(sel.matrix,5)+stageTotal(sel.matrix,6);
    h+='<div class="row" style="margin-top:10px;gap:6px;flex-wrap:wrap">'+
      '<span class="st n">'+n0(sel.base)+' base</span>'+
      '<span class="st '+(aR/sel.base>0.3?'o':'g')+'">'+pc(aR/sel.base,1)+' at risk or worse</span>'+
      '<span class="st n">'+egp(sel.weekly[11].val,0)+' AOV</span>'+
      '<span class="st n">'+sel.primary+' '+TREAT[sel.primary].name+'</span></div>'+
      '<button class="btn sm" style="margin-top:10px" onclick="openStore(\''+sel.code+'\')">Open store detail</button>';
  } else {
    h+='<div class="empty" style="padding:26px">Pick a store to see its own 35-cell grid.</div>';
  }
  h+='</div></div>';

  /* stage-to-treatment map */
  h+='<div class="card" style="margin-top:12px"><div class="card-h"><h3>Stage → treatment, fixed by design</h3>'+
    '<div class="sub">this mapping is not configurable — it is the definition of the four treatments</div></div>'+
    '<div class="grid g4" style="gap:10px">'+
    ['T1','T2','T3','T4'].map(function(t){
      var d=TREAT[t];
      var stg=Object.keys(STAGE_TREAT).filter(function(k){return STAGE_TREAT[k]===t});
      var n=stg.reduce(function(a,k){return a+stageTotal(m,STAGE_KEYS.indexOf(k))},0);
      return '<div style="background:'+d.color+'10;border:1px solid '+d.color+'38;border-radius:9px;padding:10px">'+
        '<div class="small" style="font-weight:700;color:'+d.color+'">'+t+' · '+d.name+'</div>'+
        '<div class="tsub" style="margin:3px 0 6px">'+stg.join(' · ')+'</div>'+
        '<div class="num" style="font-size:16px;font-weight:700">'+n0(n)+'</div>'+
        '<div class="tsub">addressable · '+d.kpi+'</div></div>';
    }).join('')+'</div></div>';
  return h;
}

  });
  var contacts=ACTIVITIES.reduce(function(a,x){return a+x.contacts},0);
  var incr=ACTIVITIES.reduce(function(a,x){return a+(x.incremental||0)},0);

  var h='';
  h+='<div class="grid g4" style="margin-bottom:12px">'+

     ['Measured incremental',egp(incr),'holdout-differenced','var(--g)'],

    .map(function(x){return '<div class="card" style="padding:12px"><div class="small muted" style="font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700">'+x[0]+'</div>'+
      '<div class="num" style="font-size:19px;font-weight:700;margin:3px 0;color:'+x[3]+'">'+x[1]+'</div><div class="tsub">'+x[2]+'</div></div>'}).join('')+
    '</div>';

  if(nohold) h+='<div class="warnbox" style="margin-bottom:12px"><span>⚠</span><span><b>'+nohold+' activities have no holdout.</b> Their revenue figures are gross, not incremental, and are excluded from the uplift library. Every activity created from the Control Tower gets a holdout by default.</span></div>';

  h+='<div class="spread" style="margin-bottom:10px">'+
    '<div class="tabs">'+[['all','All'],['running','Running'],['measured','Measured'],['planned','Planned'],['nohold','No holdout']]
      .map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" onclick="state.actTab=\''+t[0]+'\';render()">'+t[1]+'</button>'}).join('')+'</div>'+

  h+='<div class="card pad0"><table><thead><tr>'+

  list.forEach(function(a){
    var st=actStatus(a.status);
    h+='<tr class="cl" onclick="openActivity(\''+a.id+'\')">'+
      '<td style="max-width:250px"><div class="tname" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(a.name)+'</div>'+
      '<div class="tsub">'+a.id+' · '+esc(a.channel)+' · '+esc(a.offer)+'</div></td>'+
      '<td class="small mono">'+a.store+'</td>'+
      '<td><span class="st" style="color:'+TREAT[a.treatment].color+';background:'+TREAT[a.treatment].color+'14;border-color:'+TREAT[a.treatment].color+'38;font-size:9.5px">'+a.treatment+'</span></td>'+
      '<td class="small mono">'+a.week+'</td>'+
      '<td class="small muted">'+a.stage+' · '+a.tiers+'</td>'+
      '<td class="tr num">'+n0(a.audience)+'</td>'+
      '<td class="tr num" style="color:'+(a.holdout?'var(--tx2)':'var(--o)')+'">'+(a.holdout?pc(a.holdout,0):'none')+'</td>'+
      '<td class="tr num">'+(a.revenue?egp(a.revenue):'—')+'</td>'+
      '<td class="tr num" style="color:'+(a.incremental?'var(--g)':'var(--tx3)')+'">'+(a.incremental!=null?egp(a.incremental):'—')+'</td>'+
      '<td class="tr num muted">'+egp(a.cost)+'</td>'+
      '<td><span class="st '+st[0]+'" style="font-size:9.5px"><i></i>'+st[1]+'</span></td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="small muted" style="margin-top:10px">Every row carries <span class="mono">store_id</span>, <span class="mono">lifecycle_stage</span>, <span class="mono">value_tier</span> and the CVM component the activity is meant to move. That is what makes the log a control instrument rather than a campaign archive.</div>';
  return h;
}

function openActivity(id){
  var a=ACTIVITIES.filter(function(x){return x.id===id})[0]; if(!a) return;
  var s=STORES.filter(function(x){return x.code===a.store})[0];
  var st=actStatus(a.status);
  var b='';
  b+='<div class="row" style="gap:6px;margin-bottom:12px;flex-wrap:wrap">'+treatChip(a.treatment)+
     '<span class="st '+st[0]+'"><i></i>'+st[1]+'</span>'+
     (a.test?'<span class="st c"><i></i>'+a.test+'</span>':'<span class="st o"><i></i>no test linked</span>')+'</div>';

  b+='<div class="sec">Hypothesis</div><div class="card small" style="padding:11px 12px;color:var(--tx2);line-height:1.6">'+esc(a.hypothesis)+
     '<div class="tsub" style="margin-top:6px">If true, it should move <b style="color:var(--tx)">'+a.component.toUpperCase()+'</b> in store '+a.store+'.</div></div>';

  b+='<div class="sec">Design</div>';
  b+='<div class="grid g2" style="gap:8px">'+
    [['Audience',n0(a.audience)+' customers'],['Holdout',a.holdout?pc(a.holdout,0)+' ('+n0(Math.round(a.audience*a.holdout))+')':'none'],
     ['Stage / tier',a.stage+' · '+a.tiers],['Channel',a.channel],
     ['Offer',a.offer],['Owner',a.owner],['Week',a.week],['Store',a.store+' · '+s.name]]
    .map(function(x){return '<div style="background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 10px"><div class="tsub">'+x[0]+'</div><div class="small" style="font-weight:600;margin-top:1px">'+esc(x[1])+'</div></div>'}).join('')+'</div>';

  b+='<div class="sec">Result</div>';
  if(a.incremental!=null){
    var roas=a.incremental/a.cost;

function reqCon(s){ // continuation needed, other components held, to hit target
  var c=s.weekly[11];
  var other=Math.pow(c.frq/BASE.frq,WT.frq)*Math.pow(c.val/BASE.val,WT.val)*Math.pow(c.bse/BASE.bse,WT.bse);
  var K=(s.target/100)/other;
  return BASE.con*Math.pow(K,1/WT.con);
}
function reqVal(s){
  var c=s.weekly[11];
  var other=Math.pow(c.con/BASE.con,WT.con)*Math.pow(c.frq/BASE.frq,WT.frq)*Math.pow(c.bse/BASE.bse,WT.bse);
  var K=(s.target/100)/other;
  return BASE.val*Math.pow(K,1/WT.val);
}
function vTargets(){

     ['Branches on target',STORES.filter(function(s){return s.cvm>=s.target}).length+' / '+STORES.length,'CVM at or above target','var(--g)'],
     ['Branches needing >5 pts',STORES.filter(function(s){return s.target-s.cvm>5}).length,'structural, not tactical','var(--r)']]
    .map(function(x){return '<div class="card" style="padding:12px"><div class="small muted" style="font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700">'+x[0]+'</div>'+
      '<div class="num" style="font-size:20px;font-weight:700;margin:3px 0;color:'+x[3]+'">'+x[1]+'</div><div class="tsub">'+x[2]+'</div></div>'}).join('')+
    '</div>';

  h+='<div class="grid g23">';
  /* table */
  h+='<div class="card pad0"><div class="card-h" style="padding:14px 14px 0"><h3>Target vs actual vs forecast</h3>'+
    '<div class="sub">forecast = last-4-week linear continuation, no planned activity</div></div>'+
    '<table><thead><tr><th>Branch</th><th class="tr">Target</th><th class="tr">Actual</th><th class="tr">Var</th>'+
    '<th class="tr">W48 forecast</th><th class="tr">Gap to close</th><th>Cheapest lever</th></tr></thead><tbody>';
  STORES.slice().sort(function(a,b){return (b.target-b.cvm)-(a.target-a.cvm)}).forEach(function(s){
    var w=s.weekly, fc=w[11].cvm+(w[11].cvm-w[7].cvm)/4;
    var needCon=reqCon(s), needVal=reqVal(s), c=w[11];
    var dCon=needCon-c.con, dVal=needVal-c.val;
    var lever = s.target<=s.cvm ? '— hold' :
      (Math.abs(dCon)/c.con < Math.abs(dVal)/c.val
        ? 'CON +'+(dCon*100).toFixed(1)+' pts'
        : 'VAL +EGP '+Math.round(dVal));
    h+='<tr class="cl" onclick="openStore(\''+s.code+'\')">'+
      '<td><div class="tname">'+s.code+' · '+esc(s.name)+'</div><div class="tsub">'+s.areaName+'</div></td>'+
      '<td class="tr num muted">'+s.target+'</td>'+

      '<td class="tr num" style="color:'+(s.cvm>=s.target?'var(--g)':'var(--r)')+'">'+pt(s.cvm-s.target,1)+'</td>'+
      '<td class="tr num" style="color:'+(fc>=s.target?'var(--g)':'var(--o)')+'">'+fc.toFixed(1)+'</td>'+
      '<td class="tr num">'+(s.target>s.cvm?(s.target-s.cvm).toFixed(1):'0.0')+'</td>'+

  /* what-if */

    .map(function(r){

      return '<tr><td class="small">'+r[0]+'</td><td class="tr num muted">'+r[1].toFixed(1)+'</td>'+
      '<td class="tr num">'+r[2].toFixed(1)+'</td>'+
      '<td class="tr num" style="color:'+(v>=0?'var(--g)':'var(--r)')+'">'+pt(v,1)+'</td>'+
      '<td class="small muted">'+(v>=0?'on plan':v>-2?'recoverable this month':'re-baseline needed')+'</td></tr>';
    }).join('')+'</tbody></table></div>'+
    '<div class="card"><div class="card-h"><h3>Rules that govern the plan</h3></div>'+
    '<div class="small" style="color:var(--tx2);line-height:1.75">'+
    '<div>· A store may not run more than <b>2 activities per week per treatment</b> without an explicit override.</div>'+
    '<div>· No activity is created without a holdout; no-holdout activities are excluded from the uplift library.</div>'+
    '<div>· Contact volume cannot exceed <b>3 contacts per customer per week</b>; the cap binds before the index does.</div>'+
    '<div>· A target may be revised only at the quarterly reset, and only with a written reason.</div>'+
    '<div>· When acquisition rises ≥10% while the index falls ≥3 pts, the plan is frozen and re-scoped. This is not a warning — it is a stop.</div>'+
    '</div></div></div>';
  return h;
}
function whatif(v){
  v=+v;
  var c=0.0012*v, f=0.0008*v, b=0.0003*v, bs=0.0002*v;
  var idx=0;
  STORES.forEach(function(s){
    var w=s.weekly[11];
    idx+=cvmOf(w.con*(1+c),w.frq*(1+f),w.val*(1-b),w.bse*(1-bs))*w.value;
  });
  idx/=GROUP.totalValue;
  var d=idx-GROUP.cvm;
  var contactsPerWeek=GROUP.totalActive*0.8;
  var extraCost=contactsPerWeek*(v/100)*4.2;
  document.getElementById('wiOut').innerHTML=
    '<div class="grid g3" style="gap:8px;margin-top:4px">'+
    [['Projected index',idx.toFixed(1),(d>=0?'+':'')+d.toFixed(2)+' pts',(d>=0?'var(--g)':'var(--r)')],
     ['Extra contacts / week',n0(contactsPerWeek*v/100),'on top of today','var(--tx)'],
     ['Extra cost / week',egp(extraCost),'at EGP 4.20 per contact','var(--o)']]
    .map(function(x){return '<div style="background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 10px"><div class="tsub">'+x[0]+'</div><div class="num" style="font-size:14px;font-weight:700;color:'+x[3]+'">'+x[1]+'</div><div class="tsub">'+x[2]+'</div></div>'}).join('')+'</div>'+
    '<div class="'+(v>25?'warnbox':'okbox')+'" style="margin-top:9px"><span>'+(v>25?'⚠':'✓')+'</span><span>'+
    (v>25? 'Beyond +25% the opt-out elasticity starts to eat the gain; past roughly +40% the index usually falls. Volume is not a plan.'
         : v<0? 'Cutting volume saves cost and slowly costs retention — acceptable for a quarter, not a strategy.'
         : 'Within the range where contact volume still buys retention. It buys a fraction of a point, not a gap.')+
    '</span></div>';
}

  var h='';
  h+='<div class="grid g23">';

  /* weights */
  h+='<div class="card"><div class="card-h"><h3>CVM index weights</h3>'+
    '<div class="sub">move a slider and watch the rank stability test — this is the acceptance criterion, not the formula</div></div>'+
    '<div id="wSliders"></div><div id="wOut" style="margin-top:10px"></div>'+
    '<div class="row" style="margin-top:10px"><button class="btn sm" onclick="simW={con:0.4,frq:0.2,val:0.25,bse:0.15};drawSliders()">Reset to live</button>'+
    '<button class="btn sm" onclick="toast(\'Proposal saved as a draft — weight changes need the quarterly reset\',\'ok\')">Propose change</button></div></div>';

  /* rationale */
  h+='<div class="card"><div class="card-h"><h3>Why these weights</h3></div>'+
    '<div class="small" style="color:var(--tx2);line-height:1.7">'+
    '<div style="margin-bottom:7px"><b style="color:var(--tx)">Continuation dominates at 0.40</b> because monthly continuation is the declared north star of the strategy. It is not 1.0, because a single metric weighting itself is just the metric again.</div>'+
    '<div style="margin-bottom:7px"><b style="color:var(--tx)">Basket is 0.25, not higher,</b> because a basket gain on a shrinking base is a false win — it is exactly the pattern that made the acquisition case look healthy while value decayed.</div>'+
    '<div style="margin-bottom:7px"><b style="color:var(--tx)">Frequency is 0.20</b> and is the leading version of the same signal: orders per active customer fall two to four weeks before continuation does.</div>'+
    '<div><b style="color:var(--tx)">Base health is the lowest at 0.15</b> because it overlaps continuation and moves slowly — it is the context term, not a driver.</div>'+
    '</div>'+
    '<div class="sec">Constraints enforced</div>'+
    '<table><tbody>'+
    [['C1','CON ≥ 0.35','continuation must dominate'],['C2','VAL + FRQ ≥ 0.40','commercial and cadence weight cannot be starved'],
     ['C3','BSE ≤ 0.20','context term stays a context term'],['C4','each ≥ 0.15','below this a 10-pt collapse is under 0.8 index points — invisible'],
     ['C5','Σ = 1','obvious, and violated constantly in practice']]
    .map(function(r){return '<tr><td class="mono small muted" style="width:34px">'+r[0]+'</td><td class="small" style="width:88px">'+r[1]+'</td><td class="tsub">'+r[2]+'</td></tr>'}).join('')+
    '</tbody></table></div>';

  h+='</div>';

  /* thresholds */
  h+='<div class="grid g2" style="margin-top:12px">'+
    '<div class="card"><div class="card-h"><h3>Status thresholds</h3><div class="sub">relative to the store target, never to the group</div></div>'+
    '<table><tbody>'+
    [['g','On target','index ≥ target'],['w','Watch','target −3 to 0'],['o','Off target','target −8 to −3, or 2 consecutive off weeks'],
     ['r','Critical','below target −8, or 3 consecutive off weeks']]
    .map(function(r){return '<tr><td style="width:100px">'+statusPill(r[0])+'</td><td class="small" style="width:130px">'+r[2]+'</td><td class="tsub">'+r[1]+'</td></tr>'}).join('')+
    '</tbody></table><div class="tsub" style="margin-top:8px">A guardrail breach downgrades one level and cannot be traded away.</div></div>';

  h+='<div class="card"><div class="card-h"><h3>Hierarchy</h3><div class="sub">three levels, not fixed — nodes are effective-dated</div></div>'+
    '<table><thead><tr><th>Level</th><th>Node</th><th class="tr">Stores</th></tr></thead><tbody>'+
    '<tr><td class="small">1 · Group</td><td class="small" style="font-weight:600">Seoudi</td><td class="tr num">24</td></tr>'+
    AREAS.map(function(a){
      return '<tr><td class="small muted">2 · Area</td><td class="small">'+esc(a.name)+'</td><td class="tr num">'+STORES.filter(function(s){return s.area===a.id}).length+'</td></tr>';
    }).join('')+
    '<tr><td class="small muted">3 · Branch</td><td class="small muted">physical branch — order attributed by fulfilling store</td><td class="tr num">24</td></tr>'+
    '</tbody></table><div class="tsub" style="margin-top:8px">Branch and area nodes carry validity dates, so a closed branch does not rewrite history.</div></div></div>';

  /* data + policy */
  h+='<div class="grid g3" style="margin-top:12px">'+
    '<div class="card"><div class="card-h"><h3>Data gates</h3><div class="sub">must pass before any screen updates</div></div>'+
    '<div class="small" style="line-height:1.9">'+
    [['Store attribution coverage ≥ 99%',true],['Item-level completeness ≥ 98%',false],
     ['Dismissal field present ≥ 96%',true],['PL flag populated ≥ 98%',true],['No unconsented contact',true]]
    .map(function(g){return '<div class="spread"><span>'+g[0]+'</span><span class="st '+(g[1]?'g':'r')+'"><i></i>'+(g[1]?'pass':'fail')+'</span></div>'}).join('')+
    '</div></div>'+
    '<div class="card"><div class="card-h"><h3>Contact policy</h3></div>'+
    '<div class="small" style="color:var(--tx2);line-height:1.9">'+
    '<div class="spread"><span>Max contacts / customer / week</span><b>3</b></div>'+
    '<div class="spread"><span>Default holdout</span><b>10%</b></div>'+
    '<div class="spread"><span>Holdout, SMS &gt; 5,000</span><b>20%</b></div>'+
    '<div class="spread"><span>Quiet hours</span><b>21:00–09:00</b></div>'+
    '<div class="spread"><span>Opt-out suppression</span><b>immediate</b></div>'+
    '<div class="spread"><span>"Don\'t send"</span><b>first-class outcome</b></div></div></div>'+
    '<div class="card"><div class="card-h"><h3>Roles</h3></div>'+
    '<div class="small" style="color:var(--tx2);line-height:1.9">'+
    [['Commercial','own targets, approve activities'],['Data Science','own segment definitions'],
     ['Operations','own service metrics, blocks sends'],['Marketing','build and run activities'],
     ['Admin','weights and thresholds, quarterly only']]
    .map(function(r){return '<div class="spread"><span>'+r[0]+'</span><span class="tsub">'+r[1]+'</span></div>'}).join('')+
    '</div></div></div>';
  return h;
}
function drawSliders(){
  var keys=[['con','Continuation'],['frq','Frequency'],['val','Basket value'],['bse','Base health']];
  document.getElementById('wSliders').innerHTML=keys.map(function(k){
    return '<div class="field" style="margin-bottom:8px"><label style="display:flex;justify-content:space-between">'+
      '<span>'+k[1]+'</span><span class="mono" id="wv_'+k[0]+'" style="color:var(--acc);font-weight:700">'+simW[k[0]].toFixed(2)+'</span></label>'+
      '<input type="range" id="ws_'+k[0]+'" min="5" max="60" step="5" value="'+(simW[k[0]]*100)+'" oninput="setW(\''+k[0]+'\',this.value)" style="width:100%"></div>';
  }).join('');
  updateWeightOut();
}
function setW(k,v){
  document.getElementById('ws_'+k).value=v;
  var sum=0;
  ['con','frq','val','bse'].forEach(function(x){ sum+=+document.getElementById('ws_'+x).value/100; });
  ['con','frq','val','bse'].forEach(function(x){
    simW[x]=(+document.getElementById('ws_'+x).value/100)/sum;
    var el=document.getElementById('wv_'+x); if(el) el.textContent=simW[x].toFixed(2);
  });
  updateWeightOut();
}
function updateWeightOut(){
  var ids=STORES.map(function(s){
    var w=s.weekly[11]; return {code:s.code, a:cvmW(w.con,w.frq,w.val,w.bse,WT), b:cvmW(w.con,w.frq,w.val,w.bse,simW)};
  });
  /* rank stability: share of store pairs whose relative order flips */
  var swaps=0, pairs=0;
  for(var i=0;i<ids.length;i++) for(var j=i+1;j<ids.length;j++){
    pairs++;
    if((ids[i].a-ids[j].a)*(ids[i].b-ids[j].b)<0) swaps++;
  }
  var swapPct=swaps/pairs;
  var viol=[];
  if(simW.con<0.35) viol.push('C1 CON ≥ 0.35');
  if(simW.val+simW.frq<0.40) viol.push('C2 VAL+FRQ ≥ 0.40');
  if(simW.bse>0.20) viol.push('C3 BSE ≤ 0.20');
  if(Math.min(simW.con,simW.frq,simW.val,simW.bse)<0.15) viol.push('C4 each ≥ 0.15');
  var pass = swapPct<0.10 && viol.length===0;
  var h='<div class="grid g2" style="gap:8px">'+
    '<div style="background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px"><div class="tsub">Rank swaps vs live weights</div>'+
    '<div class="num" style="font-size:14px;font-weight:700;color:'+(swapPct<0.10?'var(--g)':'var(--r)')+'">'+pc(swapPct,1)+'</div>'+
    '<div class="tsub">'+(swaps)+' of '+pairs+' store pairs · limit 10%</div></div>'+
    '<div style="background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px"><div class="tsub">Constraint check</div>'+
    '<div class="num" style="font-size:14px;font-weight:700;color:'+(viol.length?'var(--r)':'var(--g)')+'">'+(viol.length?'violated':'all pass')+'</div>'+
    '<div class="tsub">'+(viol.length?viol.join(' · '):'C1–C5 satisfied')+'</div></div></div>'+
    '<div class="'+(pass?'okbox':'warnbox')+'" style="margin-top:8px"><span>'+(pass?'✓':'⚠')+'</span><span>'+
    (pass
      ? 'Acceptable. The ranking of stores barely moves, so any wet signature on a new weight set would be cosmetic. Note that this is the point: the test passes at the current weights precisely because they sit at a flat optimum.'
      : 'Rejected. At these weights the store ranking is being driven by noise rather than by value, and the flags that result would not be reproducible week to week. '+
        (viol.length?'It also breaks '+viol.join(' and ')+'. ':''))+
    '</span></div>'+
    '<div class="tsub" style="margin-top:8px">This is the whole acceptance test from the spec, running live on 24 stores: perturb, renormalise, recount pair swaps. A formula cannot be "correct"; a ranking can be stable or not.</div>';
  document.getElementById('wOut').innerHTML=h;
}

buildNav();
document.getElementById('pgTitle').textContent=TITLES.tower[0];
document.getElementById('pgChip').textContent=TITLES.tower[1];
document.getElementById('pgSub').textContent=TITLES.tower[2];
render();
</script>
